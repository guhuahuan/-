name: ADAS_Fix_Dependencies

on: [push]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: 1. 检出仓库
        uses: actions/checkout@v4

      - name: 2. 安装 Python 3.9 (强制稳定版)
        uses: actions/setup-python@v4
        with:
          python-version: '3.9' # 3.14 太新了，3.9 是 CoreML 的黄金版本

      - name: 3. 安装所有必备依赖
        run: |
          # 一次性解决所有 ModuleNotFoundError
          pip install torch==2.1.0 torchvision coremltools prefetch_generator opencv-python

      - name: 4. 重新生成 ADAS.py (内联修复版)
        run: |
          cat <<EOF > ADAS.py
          import torch
          import coremltools as ct
          import sys
          import os

          def export():
              print("🚀 正在加载 YOLOP 模型...")
              # 使用官方 hub 加载
              model = torch.hub.load('hustvl/yolop', 'yolop', pretrained=True, trust_repo=True)
              model.eval()
              
              print("📦 开始转换 CoreML...")
              example_input = torch.rand(1, 3, 320, 320)
              traced_model = torch.jit.trace(model, example_input)
              
              mlmodel = ct.convert(
                  traced_model,
                  inputs=[ct.ImageType(name="image", shape=example_input.shape, scale=1/255.0)]
              )
              mlmodel.save("YOLOP_ADAS.mlpackage")
              print("✅ 转换完成！")

          if __name__ == "__main__":
              export()
          EOF

      - name: 5. 运行转换脚本
        run: python ADAS.py

      - name: 6. 上传模型
        uses: actions/upload-artifact@v4
        with:
          name: YOLOP_ADAS_Model
          path: YOLOP_ADAS.mlpackage
