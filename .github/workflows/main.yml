name: YOLOP to CoreML ADAS Build

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    
    steps:
      - name: 1. 检出代码
        uses: actions/checkout@v4

      - name: 2. 安装 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: 3. 安装转换依赖 (环境锁死版)
        run: |
          python -m pip install --upgrade pip
          # 核心：降级 numpy 以解决兼容性崩溃，锁定 torch 2.0.1
          pip install "numpy<2" 
          pip install torch==2.0.1 torchvision==0.15.2 coremltools==6.3.0
          pip install PyYAML prefetch_generator tqdm opencv-python pandas requests scipy matplotlib yacs thop

      - name: 4. 执行模型转换
        run: |
          python -c "
          import torch
          import torch.nn as nn
          import coremltools as ct
          import sys

          # 简化包装类：直接通过 export 标志位的原生输出进行映射
          class WrappedModel(nn.Module):
              def __init__(self, model):
                  super().__init__()
                  self.model = model
              def forward(self, x):
                  # 在 export=True 模式下，YOLOP 通常返回三个 Tensor
                  return self.model(x)

          print('🚀 正在初始化 YOLOP 环境...')
          try:
              # 加载模型
              model = torch.hub.load('hustvl/yolop', 'yolop', pretrained=True, trust_repo=True)
              model.eval()
              
              # 重要：开启 YOLOP 的导出模式
              for m in model.modules():
                  if hasattr(m, 'export'):
                      m.export = True 

              # 测试运行一次以确认输出结构
              example_input = torch.rand(1, 3, 320, 320)
              with torch.no_grad():
                  test_out = model(example_input)
                  print(f'📦 模型输出结构确认: 包含 {len(test_out)} 个输出节点')

              print('📦 正在生成 JIT Trace (strict=False)...')
              traced_model = torch.jit.trace(model, example_input, strict=False)

              print('🛠️ 正在转换为 CoreML...')
              mlmodel = ct.convert(
                  traced_model,
                  inputs=[ct.ImageType(name='image', shape=example_input.shape, scale=1/255.0, color_layout=ct.colorlayout.RGB)],
                  outputs=[
                      ct.TensorType(name='det_output'),       # 检测框输出
                      ct.TensorType(name='drive_area_mask'),  # 可行驶区域
                      ct.TensorType(name='lane_line_mask')    # 车道线
                  ],
                  minimum_deployment_target=ct.target.iOS15
              )

              mlmodel.save('YOLOP_ADAS.mlpackage')
              print('✅ 转换大功告成！')
              
          except Exception as e:
              print(f'❌ 转换失败，详细错误: {str(e)}')
              # 打印回溯信息方便调试
              import traceback
              traceback.print_exc()
              sys.exit(1)
          "

      - name: 5. 上传模型
        uses: actions/upload-artifact@v4
        with:
          name: YOLOP_CoreML_Model
          path: YOLOP_ADAS.mlpackage
