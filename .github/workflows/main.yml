name: ADAS_Final_Fix_v3

on: [push]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: 1. 检出仓库
        uses: actions/checkout@v4

      - name: 2. 安装 Python 3.9
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: 3. 安装所有环境依赖 (含 yacs)
        run: |
          # 补充了 yacs 和 tqdm，确保模型加载不报错
          pip install "numpy<2" torch==2.1.0 torchvision coremltools prefetch_generator scipy opencv-python matplotlib pyyaml tensorboard yacs tqdm

      - name: 4. 云端生成 ADAS.py
        run: |
          cat <<EOF > ADAS.py
          import torch
          import coremltools as ct
          import sys
          import os
          import shutil

          def export():
              hub_dir = torch.hub.get_dir()
              if os.path.exists(hub_dir):
                  shutil.rmtree(hub_dir)

              print("🚀 依赖已补全，正在加载 YOLOP 模型...")
              try:
                  # 加载模型主体
                  model = torch.hub.load('hustvl/yolop', 'yolop', pretrained=True, trust_repo=True, force_reload=True)
                  model.eval()
                  
                  print("📦 正在转换并进行 iOS 算子优化...")
                  example_input = torch.rand(1, 3, 320, 320)
                  traced_model = torch.jit.trace(model, example_input)
                  
                  mlmodel = ct.convert(
                      traced_model,
                      inputs=[ct.ImageType(name="image", shape=example_input.shape, scale=1/255.0, color_layout=ct.colorlayout.RGB)]
                  )
                  
                  mlmodel.save("YOLOP_ADAS.mlpackage")
                  print("✅ 恭喜！模型转换大获成功！")
              except Exception as e:
                  print(f"❌ 运行中发生错误: {e}")
                  sys.exit(1)

          if __name__ == "__main__":
              export()
          EOF

      - name: 5. 执行转换
        run: python ADAS.py

      - name: 6. 上传模型成品
        uses: actions/upload-artifact@v4
        with:
          name: YOLOP_ADAS_Final_Model
          path: YOLOP_ADAS.mlpackage
