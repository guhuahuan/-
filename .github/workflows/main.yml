name: ADAS_Compatibility_Fix

on: [push]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: 1. 检出仓库
        uses: actions/checkout@v4

      - name: 2. 安装 Python 3.9
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: 3. 强制安装兼容版依赖
        run: |
          # 关键点：将 numpy 降级到 1.x 版本，并补上 scipy
          pip install "numpy<2" torch==2.1.0 torchvision coremltools prefetch_generator scipy opencv-python

      - name: 4. 云端生成 ADAS.py
        run: |
          cat <<EOF > ADAS.py
          import torch
          import coremltools as ct
          import sys
          import os

          def export():
              print("🚀 正在加载 YOLOP 模型...")
              # trust_repo=True 必须保留以跳过交互提示
              model = torch.hub.load('hustvl/yolop', 'yolop', pretrained=True, trust_repo=True)
              model.eval()
              
              print("📦 正在将 PyTorch 转换为 CoreML (iOS 格式)...")
              example_input = torch.rand(1, 3, 320, 320)
              traced_model = torch.jit.trace(model, example_input)
              
              mlmodel = ct.convert(
                  traced_model,
                  inputs=[ct.ImageType(name="image", shape=example_input.shape, scale=1/255.0)]
              )
              
              # 保存为 iOS 可以直接调用的包格式
              mlmodel.save("YOLOP_ADAS.mlpackage")
              print("✅ 转换成功！")

          if __name__ == "__main__":
              export()
          EOF

      - name: 5. 运行转换脚本
        run: python ADAS.py

      - name: 6. 上传生成的模型
        uses: actions/upload-artifact@v4
        with:
          name: YOLOP_ADAS_CoreML
          path: YOLOP_ADAS.mlpackage
