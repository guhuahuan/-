name: YOLOP to CoreML ADAS Build

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    
    steps:
      - name: 1. 检出代码
        uses: actions/checkout@v4

      - name: 2. 安装 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: 3. 安装转换依赖
        run: |
          python -m pip install --upgrade pip
          pip install torch==2.0.0 torchvision==0.15.1 coremltools==6.3.0
          pip install PyYAML prefetch_generator tqdm numpy opencv-python pandas requests scipy matplotlib yacs thop

      - name: 4. 执行模型转换
        run: |
          python -c "
          import torch
          import torch.nn as nn
          import coremltools as ct
          import sys

          class WrappedModel(nn.Module):
              def __init__(self, model):
                  super().__init__()
                  self.model = model
              def forward(self, x):
                  outputs = self.model(x)
                  return outputs[0], outputs[1][0], outputs[1][1]

          print('🚀 正在加载 YOLOP 源码与预训练权重...')
          try:
              # 设置 trust_repo=True 是加载 GitHub Hub 模型的必要条件
              raw_model = torch.hub.load('hustvl/yolop', 'yolop', pretrained=True, trust_repo=True)
              raw_model.eval()
              for m in raw_model.modules():
                  if hasattr(m, 'export'): m.export = True 

              model = WrappedModel(raw_model).eval()
              example_input = torch.rand(1, 3, 320, 320)
              
              print('📦 正在生成 TorchScript JIT Trace...')
              traced_model = torch.jit.trace(model, example_input, strict=False)

              print('🛠️ 正在转换为 CoreML mlpackage...')
              mlmodel = ct.convert(
                  traced_model,
                  inputs=[ct.ImageType(name='image', shape=example_input.shape, scale=1/255.0, color_layout=ct.colorlayout.RGB)],
                  outputs=[
                      ct.TensorType(name='det_output'),
                      ct.TensorType(name='drive_area_mask'),
                      ct.TensorType(name='lane_line_mask')
                  ],
                  minimum_deployment_target=ct.target.iOS15
              )

              mlmodel.save('YOLOP_ADAS.mlpackage')
              print('✅ 转换大功告成！')
          except Exception as e:
              print(f'❌ 转换失败: {str(e)}')
              sys.exit(1)
          "

      - name: 5. 上传模型
        uses: actions/upload-artifact@v4
        with:
          name: YOLOP_CoreML_Model
          path: YOLOP_ADAS.mlpackage
