name: ADAS_Final_Fix

on: [push]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: 1. 检出仓库
        uses: actions/checkout@v4

      - name: 2. 安装 Python 3.9
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: 3. 补全所有缺失的视觉库
        run: |
          # 强制降级 numpy 并安装 matplotlib, scipy, yaml 等
          pip install "numpy<2" torch==2.1.0 torchvision coremltools prefetch_generator scipy opencv-python matplotlib pyyaml tensorboard

      - name: 4. 云端生成 ADAS.py
        run: |
          cat <<EOF > ADAS.py
          import torch
          import coremltools as ct
          import sys
          import os

          def export():
              print("🚀 依赖已就绪，正在加载 YOLOP 模型...")
              # 从官方 Hub 镜像加载
              model = torch.hub.load('hustvl/yolop', 'yolop', pretrained=True, trust_repo=True)
              model.eval()
              
              print("📦 正在转换并进行算子优化...")
              example_input = torch.rand(1, 3, 320, 320)
              traced_model = torch.jit.trace(model, example_input)
              
              mlmodel = ct.convert(
                  traced_model,
                  inputs=[ct.ImageType(name="image", shape=example_input.shape, scale=1/255.0)]
              )
              
              # 保存为 iOS CoreML 格式
              mlmodel.save("YOLOP_ADAS.mlpackage")
              print("✅ 转换大功告成！")

          if __name__ == "__main__":
              export()
          EOF

      - name: 5. 运行转换脚本
        run: python ADAS.py

      - name: 6. 上传生成的模型 (iOS 专用)
        uses: actions/upload-artifact@v4
        with:
          name: YOLOP_ADAS_Final_Model
          path: YOLOP_ADAS.mlpackage
