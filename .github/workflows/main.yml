- name: 4. 云端生成 ADAS.py (输出整形版)
        run: |
          cat <<EOF > ADAS.py
          import torch
          import torch.nn as nn
          import coremltools as ct
          import sys
          import os
          import shutil

          class WrappedModel(nn.Module):
              def __init__(self, model):
                  super().__init__()
                  self.model = model
              
              def forward(self, x):
                  # YOLOP 的输出通常是：( [检测张量], [路面分割, 车道线分割] )
                  # 我们直接把它们解构出来
                  outputs = self.model(x)
                  
                  # 这里的索引是根据 YOLOP 源码定义的
                  det_out = outputs[0]  # 检测框结果
                  drive_area = outputs[1][0] # 路面分割区域
                  lane_line = outputs[1][1]  # 车道线分割区域
                  
                  # 返回一个清晰的元组，CoreML 能够自动识别这些张量
                  return det_out, drive_area, lane_line

          def export():
              print("🚀 正在加载 YOLOP (Export 模式)...")
              try:
                  model = torch.hub.load('hustvl/yolop', 'yolop', pretrained=True, trust_repo=True)
                  model.eval()
                  
                  # 1. 关键修复：切换导出模式以避开不兼容算子
                  for m in model.modules():
                      if hasattr(m, 'export'):
                          m.export = True 

                  # 2. 包装模型，重塑输出结构
                  wrapped_model = WrappedModel(model)
                  wrapped_model.eval()

                  print("📦 正在进行 JIT Trace (重新编排输出)...")
                  example_input = torch.rand(1, 3, 320, 320)
                  # 使用 strict=False 处理内部列表逻辑
                  traced_model = torch.jit.trace(wrapped_model, example_input, strict=False)
                  
                  print("🛠️ 正在转换为 CoreML...")
                  mlmodel = ct.convert(
                      traced_model,
                      inputs=[ct.ImageType(name="image", shape=example_input.shape, scale=1/255.0, color_layout=ct.colorlayout.RGB)],
                      # 给输出起好听的名字，方便以后在 Swift 里调用
                      outputs=[
                          ct.TensorType(name="det_output"),
                          ct.TensorType(name="drive_area_mask"),
                          ct.TensorType(name="lane_line_mask")
                      ],
                      minimum_deployment_target=ct.target.iOS15 
                  )
                  
                  mlmodel.save("YOLOP_ADAS.mlpackage")
                  print("✅✅✅ 最终转换成功！请检查 Artifacts 下载模型。")
              except Exception as e:
                  print(f"❌ 运行中发生错误: {e}")
                  import traceback
                  traceback.print_exc()
                  sys.exit(1)

          if __name__ == "__main__":
              export()
          EOF
