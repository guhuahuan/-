name: ADAS_Final_Success

on: [push]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: 1. 检出仓库
        uses: actions/checkout@v4

      - name: 2. 安装 Python 3.9
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: 3. 安装依赖
        run: |
          pip install "numpy<2" torch==2.1.0 torchvision coremltools prefetch_generator scipy opencv-python matplotlib pyyaml tensorboard yacs tqdm

      - name: 4. 云端生成 ADAS.py (强制绕过 In-place 算子)
        run: |
          cat <<EOF > ADAS.py
          import torch
          import torch.nn as nn
          import coremltools as ct
          import sys
          import os
          import shutil

          class WrappedModel(nn.Module):
              def __init__(self, model):
                  super().__init__()
                  self.model = model
              def forward(self, x):
                  # 强制让 YOLOP 只返回原始推理结果，不进行复杂的后处理
                  # 后处理我们可以在 iOS App 里用 Swift 轻松完成
                  return self.model(x)

          def export():
              hub_dir = torch.hub.get_dir()
              if os.path.exists(hub_dir):
                  shutil.rmtree(hub_dir)

              print("🚀 正在加载 YOLOP (Export 模式)...")
              try:
                  # 关键：加载原始模型
                  model = torch.hub.load('hustvl/yolop', 'yolop', pretrained=True, trust_repo=True, force_reload=True)
                  model.eval()
                  
                  # 核心修复：遍历模型，寻找检测头并关闭特定的后处理逻辑 
                  for m in model.modules():
                      if hasattr(m, 'export'):
                          print(f"✅ 成功将 {m.__class__.__name__} 切换至导出模式")
                          m.export = True 

                  print("📦 正在进行 JIT Trace...")
                  example_input = torch.rand(1, 3, 320, 320)
                  
                  # 关键：使用 strict=False 允许 CoreML 忽略那些无关紧要的张量拷贝
                  traced_model = torch.jit.trace(model, example_input, strict=False)
                  
                  print("🛠️ 正在转换为 CoreML...")
                  mlmodel = ct.convert(
                      traced_model,
                      inputs=[ct.ImageType(name="image", shape=example_input.shape, scale=1/255.0, color_layout=ct.colorlayout.RGB)],
                      minimum_deployment_target=ct.target.iOS15 
                  )
                  
                  mlmodel.save("YOLOP_ADAS.mlpackage")
                  print("✅✅✅ 奇迹发生了！模型转换成功！")
              except Exception as e:
                  print(f"❌ 错误详情: {e}")
                  sys.exit(1)

          if __name__ == "__main__":
              export()
          EOF

      - name: 5. 执行转换
        run: python ADAS.py

      - name: 6. 上传最终模型
        uses: actions/upload-artifact@v4
        with:
          name: YOLOP_ADAS_CoreML_Fixed
          path: YOLOP_ADAS.mlpackage
