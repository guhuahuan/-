name: YOLOP to CoreML ADAS Build

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    
    steps:
      - name: 1. 检出代码
        uses: actions/checkout@v4

      - name: 2. 安装 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: 3. 安装转换依赖 (环境锁死版)
        run: |
          python -m pip install --upgrade pip
          # 核心：降级 numpy 以解决兼容性崩溃，锁定 torch 2.0.1
          pip install "numpy<2" 
          pip install torch==2.0.1 torchvision==0.15.2 coremltools==6.3.0
          pip install PyYAML prefetch_generator tqdm opencv-python pandas requests scipy matplotlib yacs thop
      - name: 4. 执行模型转换 (针对 Detect 层形状修复)
        run: |
          pip install "numpy<2.0.0" 
          
          python -c "
          import torch
          import torch.nn as nn
          import coremltools as ct
          import sys

          # 1. 定义包装器
          class YOLOPCoreMLWrapper(nn.Module):
              def __init__(self, model):
                  super().__init__()
                  self.model = model
              def forward(self, x):
                  out = self.model(x)
                  if isinstance(out, (list, tuple)):
                      if len(out) == 2 and isinstance(out[1], (list, tuple)):
                          return out[0], out[1][0], out[1][1]
                      return out[0], out[1], out[2]
                  return out

          try:
              print('🚀 加载 YOLOP 并应用 Patch...')
              raw_model = torch.hub.load('hustvl/yolop', 'yolop', pretrained=True, trust_repo=True)
              raw_model.eval()
              
              # --- 核心 Patch 逻辑 ---
              # 遍历所有模块，寻找 Detect 层并强制其进入导出模式，同时禁用内部 Grid 赋值
              for m in raw_model.modules():
                  if hasattr(m, 'export'):
                      m.export = True 
                  # 针对 Detect 层（通常是模型最后一层）
                  # 强制让它不要在 forward 中尝试根据输入动态更新 grid 形状
                  if type(m).__name__ == 'Detect':
                      m.inplace = False  # 禁用原位操作
              
              wrapper = YOLOPCoreMLWrapper(raw_model).eval()
              example_input = torch.rand(1, 3, 320, 320)
              
              # 先跑一次热身，确保所有 buffer 已初始化
              with torch.no_grad():
                  _ = wrapper(example_input)

              print('📦 执行 JIT Trace...')
              # 使用 strict=False 允许忽略某些非关键的分支逻辑
              traced_model = torch.jit.trace(wrapper, example_input, strict=False, check_trace=False)

              print('🛠️ 开始 CoreML 转换...')
              mlmodel = ct.convert(
                  traced_model,
                  inputs=[ct.ImageType(name='image', shape=example_input.shape, scale=1/255.0, color_layout=ct.colorlayout.RGB)],
                  outputs=[
                      ct.TensorType(name='det_output'),
                      ct.TensorType(name='drive_area_mask'),
                      ct.TensorType(name='lane_line_mask')
                  ],
                  minimum_deployment_target=ct.target.iOS15
              )

              mlmodel.save('YOLOP_ADAS.mlpackage')
              print('✅ ✅ 转换大功告成！')
              
          except Exception as e:
              print(f'❌ 转换失败: {str(e)}')
              import traceback
              traceback.print_exc()
              sys.exit(1)
          "
      - name: 5. 上传模型
        uses: actions/upload-artifact@v4
        with:
          name: YOLOP_CoreML_Model
          path: YOLOP_ADAS.mlpackage
