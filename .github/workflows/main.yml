name: YOLOP to CoreML ADAS Build

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    
    steps:
      - name: 1. 检出代码
        uses: actions/checkout@v4

      - name: 2. 安装 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: 3. 安装转换依赖 (环境锁死版)
        run: |
          python -m pip install --upgrade pip
          # 核心：降级 numpy 以解决兼容性崩溃，锁定 torch 2.0.1
          pip install "numpy<2" 
          pip install torch==2.0.1 torchvision==0.15.2 coremltools==6.3.0
          pip install PyYAML prefetch_generator tqdm opencv-python pandas requests scipy matplotlib yacs thop

      - name: 4. 执行模型转换
        run: |
          python -c "
          import torch
          import torch.nn as nn
          import coremltools as ct
          import sys

          # 强制解包类：将 YOLOP 的复杂输出转化为 3 个独立的 Tensor
          class YOLOPCoreMLWrapper(nn.Module):
              def __init__(self, model):
                  super().__init__()
                  self.model = model
              def forward(self, x):
                  # 执行原始模型
                  # YOLOP outputs: [det_out, [drive_area_out, lane_line_out]]
                  outputs = self.model(x)
                  
                  det_out = outputs[0]          # 目标检测输出 (1, n, 6)
                  drive_out = outputs[1][0]      # 可行驶区域 (1, 2, h, w)
                  lane_out = outputs[1][1]       # 车道线分割 (1, 2, h, w)
                  
                  return det_out, drive_out, lane_out

          print('🚀 正在初始化环境并降级 NumPy...')
          try:
              # 显式加载 YOLOP
              raw_model = torch.hub.load('hustvl/yolop', 'yolop', pretrained=True, trust_repo=True)
              raw_model.eval()
              
              # 开启导出模式（这会简化部分内部逻辑）
              for m in raw_model.modules():
                  if hasattr(m, 'export'): m.export = True 

              # 使用我们的包装器包裹模型
              wrapper = YOLOPCoreMLWrapper(raw_model).eval()
              
              # 定义输入尺寸 (1, 3, 320, 320)
              example_input = torch.rand(1, 3, 320, 320)
              
              print('📦 正在执行 JIT Trace (通过包装器)...')
              # 使用 strict=False 允许 Tracer 忽略非数据流相关的 Python 逻辑
              traced_model = torch.jit.trace(wrapper, example_input, strict=False)

              print('🛠️ 正在转换为 CoreML mlpackage...')
              mlmodel = ct.convert(
                  traced_model,
                  inputs=[ct.ImageType(name='image', shape=example_input.shape, scale=1/255.0, color_layout=ct.colorlayout.RGB)],
                  outputs=[
                      ct.TensorType(name='det_output'),       # 目标检测层
                      ct.TensorType(name='drive_area_mask'),  # 分割层1
                      ct.TensorType(name='lane_line_mask')    # 分割层2
                  ],
                  minimum_deployment_target=ct.target.iOS15
              )

              # 写入元数据方便在 Xcode 中查看
              mlmodel.author = 'YOLOP Team / Exported by Gemini'
              mlmodel.license = 'MIT'
              mlmodel.short_description = 'YOLOP ADAS: Object Detection, Drivable Area and Lane Detection'

              mlmodel.save('YOLOP_ADAS.mlpackage')
              print('✅ 转换大功告成！')
              
          except Exception as e:
              print(f'❌ 核心转换流程失败: {str(e)}')
              import traceback
              traceback.print_exc()
              sys.exit(1)
          "

      - name: 5. 上传模型
        uses: actions/upload-artifact@v4
        with:
          name: YOLOP_CoreML_Model
          path: YOLOP_ADAS.mlpackage
