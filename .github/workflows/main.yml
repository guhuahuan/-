name: ADAS_Build_From_Scratch

on: [push]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: 1. 检出代码
        uses: actions/checkout@v4

      - name: 2. 安装 Python 工具
        run: pip install torch torchvision coremltools

      - name: 3. 生成你的模型
        run: |
          # 确保你仓库里有那个 ADAS.py
          python ADAS.py --export

      - name: 4. 强行编译 iOS 程序
        run: |
          # 我们不使用 xcodeproj，直接用 swiftc 编译器强行生成可执行文件
          xcrun -sdk iphoneos swiftc main.swift -o ADAS_App_Binary
          
      - name: 5. 上传成品
        uses: actions/upload-artifact@v4
        with:
          name: ADAS_Binary_File
          path: ADAS_App_Binary
