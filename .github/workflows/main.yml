name: ADAS_Full_Build_System

on:
  push:
    branches: [ master ] # 匹配你的 master 分支

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: 1. 检出代码
        uses: actions/checkout@v4

      - name: 2. 安装 Python 环境
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: 3. 安装转换依赖
        run: |
          pip install torch torchvision coremltools opencv-python

      - name: 4. 执行模型转换
        run: |
          # 运行你的 ADAS.py 导出 YOLOP_ADAS.mlpackage
          python ADAS.py --export 

      - name: 5. 编译 iOS 项目
        run: |
          # 注意：这里的 -project 后面必须对应你上传的工程名
          # 暂时使用通用的编译指令
          xcodebuild build \
            -project *.xcodeproj \
            -scheme "-" \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO

      - name: 6. 打包并上传
        uses: actions/upload-artifact@v4
        with:
          name: ADAS_iPhone_Install_File
          path: build/Release-iphoneos/*.app
