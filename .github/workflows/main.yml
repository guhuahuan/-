name: YOLOP CoreML Conversion

on:
  workflow_dispatch:  # 允许手动触发
  push:
    branches: [ main ]

jobs:
  convert-to-coreml:
    runs-on: macos-latest  # 使用 macOS 以确保 CoreMLTools 兼容性最佳
    
    steps:
      - name: 1. 拉取代码
        uses: actions/checkout@v4

      - name: 2. 设置 Python 3.9
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: 3. 安装依赖
        run: |
          python -m pip install --upgrade pip
          # 关键修复 1: 强制降级 NumPy，解决 "RuntimeError: Numpy is not available"
          pip install "numpy<2.0.0"
          # 安装 Torch 和 CoreML 工具
          pip install torch torchvision coremltools opencv-python pandas requests

      - name: 4. 执行模型转换 (Python 脚本)
        run: |
          python -c "
          import torch
          import torch.nn as nn
          import coremltools as ct
          import sys
          import numpy
          
          print(f'📍 环境检测: NumPy {numpy.__version__}, PyTorch {torch.__version__}')

          # --- 定义包装器 ---
          class YOLOPCoreMLWrapper(nn.Module):
              def __init__(self, model):
                  super().__init__()
                  self.model = model
                  
              def forward(self, x):
                  out = self.model(x)
                  # 关键修复 2: 动态探测输出结构，防止 'IndexError'
                  # YOLOP 在 export 模式下输出结构可能会变平，这里做兼容处理
                  if isinstance(out, (list, tuple)):
                      # 情况 A: 嵌套列表 [det, [drive, lane]]
                      if len(out) == 2 and isinstance(out[1], (list, tuple)):
                          return out[0], out[1][0], out[1][1]
                      # 情况 B: 平铺列表 [det, drive, lane]
                      return out[0], out[1], out[2]
                  return out

          try:
              print('🚀 1. 加载 YOLOP 预训练模型...')
              # trust_repo=True 允许加载 hubconf.py
              raw_model = torch.hub.load('hustvl/yolop', 'yolop', pretrained=True, trust_repo=True)
              raw_model.eval()
              
              # 开启模型的导出模式（简化 Focus 层等算子）
              for m in raw_model.modules():
                  if hasattr(m, 'export'): m.export = True 

              # 包裹模型
              wrapper = YOLOPCoreMLWrapper(raw_model).eval()
              
              # 定义输入: Batch=1, RGB, 320x320
              example_input = torch.rand(1, 3, 320, 320)
              
              print('📦 2. 执行 JIT Tracing...')
              # 关键修复 3: check_trace=False
              # 禁用二次检查，解决 YOLOP Focus 层因切片操作导致的 'Graphs differed' 错误
              traced_model = torch.jit.trace(wrapper, example_input, strict=False, check_trace=False)

              print('🛠️ 3. 转换为 CoreML (MIL IR)...')
              mlmodel = ct.convert(
                  traced_model,
                  inputs=[
                      ct.ImageType(
                          name='image', 
                          shape=example_input.shape, 
                          scale=1/255.0, 
                          color_layout=ct.colorlayout.RGB
                      )
                  ],
                  outputs=[
                      ct.TensorType(name='det_output'),       # 目标检测结果
                      ct.TensorType(name='drive_area_mask'),  # 可行驶区域分割
                      ct.TensorType(name='lane_line_mask')    # 车道线分割
                  ],
                  minimum_deployment_target=ct.target.iOS15
              )

              # 添加元数据
              mlmodel.author = 'Hustvl / Converted by GitHub Actions'
              mlmodel.short_description = 'YOLOP: Panoptic Driving Perception'
              mlmodel.version = '1.0'

              # 保存模型
              output_path = 'YOLOP_ADAS.mlpackage'
              mlmodel.save(output_path)
              print(f'✅ 成功: 模型已保存至 {output_path}')
              
          except Exception as e:
              print(f'❌ 转换过程中发生严重错误: {str(e)}')
              import traceback
              traceback.print_exc()
              sys.exit(1)
          "

      - name: 5. 上传生成的模型
        uses: actions/upload-artifact@v4
        with:
          name: YOLOP_ADAS_CoreML
          path: YOLOP_ADAS.mlpackage
