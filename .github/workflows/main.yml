name: YOLOP to CoreML ADAS Build

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    
    steps:
      - name: 1. 检出代码
        uses: actions/checkout@v3

      - name: 2. 安装 Python 环境
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: 3. 安装转换依赖
        run: |
          python -m pip install --upgrade pip
          pip install torch torchvision torchaudio coremltools==6.3.0

      - name: 4. 执行模型转换 (内置逻辑版)
        run: |
          python -c "
          import torch
          import torch.nn as nn
          import coremltools as ct
          import sys

          # 1. 定义包装模型，解决 JIT Trace 无法解析嵌套列表的问题
          class WrappedModel(nn.Module):
              def __init__(self, model):
                  super().__init__()
                  self.model = model
              def forward(self, x):
                  # YOLOP 输出格式为 ( [det_out], [drive_area, lane_line] )
                  outputs = self.model(x)
                  # 显式提取为三个独立的张量输出
                  det_out = outputs[0]
                  drive_area = outputs[1][0]
                  lane_line = outputs[1][1]
                  return det_out, drive_area, lane_line

          print('🚀 正在从 GitHub 加载 YOLOP 预训练权重...')
          try:
              # 加载原始模型
              raw_model = torch.hub.load('hustvl/yolop', 'yolop', pretrained=True, trust_repo=True)
              raw_model.eval()
              
              # 开启导出模式，避开不兼容的 Tensor Shape 操作
              for m in raw_model.modules():
                  if hasattr(m, 'export'):
                      m.export = True 

              # 包装模型
              model = WrappedModel(raw_model).eval()
              
              # 2. 准备 Trace 输入 (320x320 是移动端较平衡的分辨率)
              example_input = torch.rand(1, 3, 320, 320)
              
              print('📦 正在进行 JIT Trace (strict=False)...')
              traced_model = torch.jit.trace(model, example_input, strict=False)

              print('🛠️ 正在转换为 CoreML 格式...')
              mlmodel = ct.convert(
                  traced_model,
                  inputs=[ct.ImageType(name='image', shape=example_input.shape, scale=1/255.0, color_layout=ct.colorlayout.RGB)],
                  outputs=[
                      ct.TensorType(name='det_output'),
                      ct.TensorType(name='drive_area_mask'),
                      ct.TensorType(name='lane_line_mask')
                  ],
                  minimum_deployment_target=ct.target.iOS15
              )

              # 保存模型
              model_name = 'YOLOP_ADAS.mlpackage'
              mlmodel.save(model_name)
              print(f'✅ 模型转换成功: {model_name}')

          except Exception as e:
              print(f'❌ 转换失败: {str(e)}')
              sys.exit(1)
          "

      - name: 5. 上传生成的模型
        uses: actions/upload-artifact@v3
        with:
          name: YOLOP_CoreML_Model
          path: YOLOP_ADAS.mlpackage
